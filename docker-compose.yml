# Docker Compose：宿主机环境变量 APP_PORT 配置对外端口（默认 8000）。
#   app     —— 常驻 Web 应用（FastAPI 托管 API 与前端静态产物），带健康检查。
#              容器内固定监听 8000；APP_PORT 只改宿主机映射端口。
#   verify  —— 一次性校验任务：等 app 健康后执行
#              pytest 后端测试 + vite 前端构建 + 温控审计 API 冒烟，
#              随后自行退出，并以退出码报告结果（restart: "no"）。
#
# 用法：
#   APP_PORT=18080 docker compose up --build app      # 仅启动应用
#   docker compose build verify && docker compose run --rm verify
#   或一键： docker compose up --build --abort-on-container-exit verify
#
# 若脱离 Compose 单独 docker run 镜像，可用 -e APP_PORT=<端口> 覆盖容器内监听端口。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: thermal-audit-app:latest
    environment:
      APP_HOST: 0.0.0.0
    ports:
      # 宿主机侧端口由环境变量 APP_PORT 配置，容器内固定 8000
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: Dockerfile
      target: verify
    image: thermal-audit-verify:latest
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
